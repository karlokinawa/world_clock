<title>World Clock</title>
<style>
  :root{
    --screen-w: 1920;
    --screen-h: 1080;
    --panel-h: 90vh;
    --panel-ratio: 1.72;
    --bg:#bfc0c2;
    --panel:#030405;
    --line:rgba(255,255,255,.28);
    --blue:#35a4ff;
    --gold:#f5be27;
    --orange:#ff8a17;
    --cyan:#39d4df;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Helvetica Neue",Arial,sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .tv{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    border:4px solid #1b1c1e;
    padding:5vh 4vw;
  }

  .panel{
    position:relative;
    height:90vh;
    width:min(calc(90vh * var(--panel-ratio)), 92vw);
    background:var(--panel);
    border-radius:22px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 0 0 2px rgba(0,0,0,.55);
    padding:2.6vh 2.2vw 2.3vh;
    display:grid;
    grid-template-rows: 38% 31% 31%;
    gap:1.1vh;
  }

  .time-row{
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .time{
    font-family:"Courier New","Noto Sans Mono",monospace;
    font-weight:700;
    font-size:clamp(92px,17.5vh,205px);
    line-height:.9;
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(255,255,255,.18);
  }

  .colon{
    display:inline-block;
    width:.44em;
    text-align:center;
    animation:blink 1s steps(1,end) infinite;
  }

  @keyframes blink{
    0%,49%{opacity:1}
    50%,100%{opacity:.08}
  }

  .date-row{
    display:grid;
    grid-template-columns: 1.22fr .95fr .95fr 1.18fr;
    border-bottom:1px solid var(--line);
  }

  .date-cell{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:1vh 1.4vw;
  }

  .date-cell + .date-cell{
    border-left:1px solid var(--line);
  }

  .label{
    font-size:clamp(16px,2.15vh,28px);
    color:var(--blue);
    margin-bottom:.5vh;
    font-weight:700;
  }

  .western-year{
    font-size:clamp(44px,6.8vh,84px);
    font-weight:800;
    white-space:nowrap;
  }

  .reiwa{
    font-size:clamp(30px,4.4vh,58px);
    font-weight:800;
    color:var(--gold);
    white-space:nowrap;
    margin-top:.55vh;
  }

  .big-date{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:.25em;
    white-space:nowrap;
  }

  .big-date .num{
    font-size:clamp(58px,9.2vh,112px);
    font-weight:800;
  }

  .big-date .unit{
    font-size:clamp(27px,4.1vh,49px);
    font-weight:700;
  }

  .weekday-main{
    text-align:center;
    font-size:clamp(42px,6.2vh,80px);
    font-weight:800;
    white-space:nowrap;
  }

  .nth{
    text-align:center;
    color:var(--gold);
    font-size:clamp(29px,4.3vh,54px);
    font-weight:800;
    margin-bottom:.35vh;
  }

  .weather{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:2px solid rgba(35,151,255,.95);
    border-radius:18px;
    overflow:hidden;
  }

  .weather-cell{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:.5vh .8vw;
  }

  .weather-cell + .weather-cell{
    border-left:1px solid rgba(255,255,255,.35);
  }

  .weather-title{
    font-size:clamp(17px,2.25vh,29px);
    font-weight:800;
    margin-bottom:.55vh;
  }

  .weather-title.temp{color:var(--orange)}
  .weather-title.hum{color:var(--blue)}
  .weather-title.cond{color:var(--gold)}
  .weather-title.wind{color:var(--cyan)}

  .weather-main{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.28em;
    font-size:clamp(37px,5.6vh,70px);
    font-weight:800;
    line-height:1;
    white-space:nowrap;
  }

  .weather-main .icon{
    font-size:1.05em;
  }

  .weather-sub{
    margin-top:.75vh;
    font-size:clamp(15px,2.05vh,25px);
    opacity:.83;
  }

  .condition-text{
    font-size:clamp(31px,4.7vh,60px);
    font-weight:800;
    margin-top:.45vh;
  }

  @media(max-aspect-ratio:16/10){
    .panel{
      width:92vw;
      height:auto;
      aspect-ratio:1.72;
      max-height:90vh;
    }
  }
</style>

<script>
let CURRENT_LAT = null;
let CURRENT_LON = null;
let CURRENT_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
let CURRENT_COUNTRY_CODE = null;

const browserLang = (navigator.language || "en").toLowerCase();
const UI_LANG = browserLang.startsWith("ja") ? "ja"
              : browserLang.startsWith("de") ? "de"
              : browserLang.startsWith("fr") ? "fr"
              : "en";
</script>

<script>
function zonedParts(){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:CURRENT_TZ,year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const o={}; parts.forEach(p=>o[p.type]=p.value); return o;
}
function reiwaText(y,m,d){
  const date=new Date(Date.UTC(y,m-1,d)), start=new Date(Date.UTC(2019,4,1));
  return date>=start?`令和${y-2018}年`:"";
}
function weekdayText(y,m,d){
  const idx=new Date(Date.UTC(y,m-1,d)).getUTCDay();
  return {
    ja:["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"],
    de:["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"],
    fr:["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"],
    en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
  }[UI_LANG][idx];
}

function monthText(month){
  const months = {
    de:["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."],
    en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
    fr:["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."],
    ja:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"]
  };
  return (months[UI_LANG] || months.en)[month - 1];
}

function nthText(day){
  const n=Math.floor((day-1)/7)+1;

  if(UI_LANG==="ja"){
    return `第${n}`;
  }

  if(UI_LANG==="de"){
    return `${n}.`;
  }

  if(UI_LANG==="fr"){
    return n===1 ? "1er" : `${n}e`;
  }

  // English
  if(n===1) return "1st";
  if(n===2) return "2nd";
  if(n===3) return "3rd";
  return `${n}th`;
}
function updateClock(){
  const p=zonedParts(), y=+p.year, m=+p.month, d=+p.day;
  document.getElementById("hh").textContent=String(p.hour).padStart(2,"0");
  document.getElementById("mm").textContent=String(p.minute).padStart(2,"0");
  document.getElementById("western").textContent = UI_LANG==="ja" ? `${y}年` : `${y}`;
  document.getElementById("reiwa").textContent = UI_LANG==="ja" ? reiwaText(y,m,d) : "";
  document.getElementById("month").textContent = monthText(m);
  document.getElementById("day").textContent = d;
  document.getElementById("weekday").textContent = weekdayText(y,m,d);
  
  {
    const nthEl = document.getElementById("nth");
    const nthValue = nthText(d);
    // Split first numeric sequence from prefix/suffix:
    // 第2 -> 第 + 2 ; 3. -> 3 + . ; 4th -> 4 + th
    const match = String(nthValue).match(/^(.*?)(\d+)(.*)$/);
    if(match){
      nthEl.innerHTML =
        '<span class="nth-prefix">' + match[1] + '</span>' +
        '<span class="nth-number">' + match[2] + '</span>' +
        '<span class="nth-suffix">' + match[3] + '</span>';
    }else{
      nthEl.textContent = nthValue;
    }
  }

  const units=document.querySelectorAll(".big-date .unit");
  if(units.length>=2){
    if(UI_LANG==="ja"){
      // monthText already includes 月; keep only 日 after the day.
      units[0].textContent = "";
      units[1].textContent = "日";
    }else{
      // Month is shown by localized abbreviation/name, day stays a plain number.
      units[0].textContent = "";
      units[1].textContent = "";
    }
  }
}
updateClock();
setInterval(updateClock,1000);
</script>

  }

<script>
const TXT = {
  de:{locating:"📍 Standort wird ermittelt…",location:"Standort",denied:"Standort nicht freigegeben",unavailable:"Standort nicht verfügbar",clearDay:"Sonnig",clearNight:"Klar",partly:"Leicht bewölkt",cloudy:"Bewölkt",drizzle:"Nieselregen",rain:"Regen",showers:"Regenschauer",thunder:"Gewitter",feels:"Gefühlt",loading:"Lädt…"},
  en:{locating:"📍 Detecting location…",location:"Location",denied:"Location permission denied",unavailable:"Location unavailable",clearDay:"Sunny",clearNight:"Clear",partly:"Partly cloudy",cloudy:"Cloudy",drizzle:"Drizzle",rain:"Rain",showers:"Showers",thunder:"Thunderstorm",feels:"Feels",loading:"Loading…"},
  ja:{locating:"📍 現在地を取得中…",location:"現在地",denied:"位置情報が許可されていません",unavailable:"位置情報を取得できません",clearDay:"晴れ",clearNight:"晴れ",partly:"晴れ時々くもり",cloudy:"くもり",drizzle:"小雨",rain:"雨",showers:"にわか雨",thunder:"雷雨",feels:"体感",loading:"読込中"},
  fr:{locating:"📍 Localisation en cours…",location:"Localisation",denied:"Accès à la localisation refusé",unavailable:"Localisation indisponible",clearDay:"Ensoleillé",clearNight:"Clair",partly:"Partiellement nuageux",cloudy:"Nuageux",drizzle:"Bruine",rain:"Pluie",showers:"Averses",thunder:"Orage",feels:"Ressenti",loading:"Chargement…"}
}[UI_LANG];

function weatherInfo(code, isDay){
  if(code===0) return [isDay?"☀️":"🌙", isDay?TXT.clearDay:TXT.clearNight];
  if(code===1) return [isDay?"🌤️":"🌙☁️", TXT.partly];
  if([2,3,45,48].includes(code)) return ["☁️", TXT.cloudy];
  if([51,53,55,56,57].includes(code)) return ["🌦️", TXT.drizzle];
  if([61,63,65,66,67].includes(code)) return ["🌧️", TXT.rain];
  if([80,81,82].includes(code)) return ["🌦️", TXT.showers];
  if([95,96,99].includes(code)) return ["⛈️", TXT.thunder];
  return ["☁️", TXT.cloudy];
}

function windDirectionText(deg){
  const idx=Math.round((((deg%360)+360)%360)/45)%8;
  const arrows=["↑","↗","→","↘","↓","↙","←","↖"];
  const names={
    de:["N","NO","O","SO","S","SW","W","NW"],
    fr:["N","NE","E","SE","S","SO","O","NO"],
    en:["N","NE","E","SE","S","SW","W","NW"],
    ja:["北","北東","東","南東","南","南西","西","北西"]
  }[UI_LANG];
  return `${names[idx]} ${arrows[idx]}`;
}


function countryCodeToFlag(code){
  if(!code || code.length !== 2) return "🌐";
  return code
    .toUpperCase()
    .replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
}

function setLocationText(main,sub=""){
  const mainEl=document.getElementById("locationMain");
  const subEl=document.getElementById("locationSub");
  const block=mainEl ? mainEl.closest(".city-block") : null;
  if(mainEl) mainEl.textContent=main;
  if(subEl) subEl.textContent=sub;
  if(block){
    const clean=String(main||"").replace(/^📍\s*/,"");
    block.classList.toggle("long-location", clean.length>15);
  }
}

async function reverseGeocode(lat,lon){
  try{
    const lang=UI_LANG==="ja"?"ja":UI_LANG==="de"?"de":UI_LANG==="fr"?"fr":"en";
    const url=`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${lang}`;
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok) throw new Error();
    const j=await r.json();
    const city=j.city||j.locality||j.principalSubdivision||TXT.location;
    const region=j.principalSubdivision||"";
    const country=j.countryName||"";
    CURRENT_COUNTRY_CODE=(j.countryCode||"").toUpperCase();
    document.getElementById("countryFlag").textContent = countryCodeToFlag(CURRENT_COUNTRY_CODE);
    setLocationText(`📍 ${city}`,[region,country].filter(Boolean).join(" · "));
  }catch(e){
    setLocationText(`📍 ${TXT.location}`,`${lat.toFixed(3)}, ${lon.toFixed(3)}`);
  }
}


function validNumber(v){
  return v !== null && v !== undefined && v !== "" && Number.isFinite(Number(v));
}

function safeTemp(v, decimals=1){
  return validNumber(v) ? `${Number(v).toFixed(decimals)}°C` : "--";
}

function safePercent(v){
  return validNumber(v) ? `${Math.round(Number(v))}%` : "--";
}

function safeInteger(v){
  return validNumber(v) ? `${Math.round(Number(v))}` : "--";
}

async function updateWeather(){
  if(CURRENT_LAT===null||CURRENT_LON===null) return;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${CURRENT_LAT}&longitude=${CURRENT_LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto`;
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok) throw new Error();
    const data=await r.json();
    const c=data.current;
    if(data.timezone) CURRENT_TZ=data.timezone;
    document.getElementById("temp").textContent=safeTemp(c.temperature_2m,1);
    document.getElementById("humidity").textContent=safePercent(c.relative_humidity_2m);
    document.getElementById("feels").textContent=validNumber(c.apparent_temperature) ? `${TXT.feels}: ${Math.round(Number(c.apparent_temperature))}°C` : `${TXT.feels}: --`;
    const info=validNumber(c.weather_code) ? weatherInfo(Number(c.weather_code),Number(c.is_day)===1) : ["❔","--"];
    document.getElementById("weatherIcon").textContent=info[0];
    document.getElementById("weatherText").textContent=info[1];
    document.getElementById("windSpeed").textContent=safeInteger(c.wind_speed_10m);
    document.getElementById("windDirection").textContent=validNumber(c.wind_direction_10m) ? windDirectionText(Number(c.wind_direction_10m)) : "--";
  }catch(e){
    console.error(e);
    document.getElementById("temp").textContent="--";
    document.getElementById("humidity").textContent="--";
    document.getElementById("feels").textContent=`${TXT.feels}: --`;
    document.getElementById("weatherIcon").textContent="❔";
    document.getElementById("weatherText").textContent="--";
    document.getElementById("windSpeed").textContent="--";
    document.getElementById("windDirection").textContent="--";
  }
}

function requestLocation(){
  setLocationText(TXT.locating,"");
  if(!navigator.geolocation){ setLocationText(`📍 ${TXT.unavailable}`,""); return; }
  navigator.geolocation.getCurrentPosition(
    async pos=>{
      CURRENT_LAT=pos.coords.latitude;
      CURRENT_LON=pos.coords.longitude;
      await reverseGeocode(CURRENT_LAT,CURRENT_LON);
      await updateWeather();
    },
    err=>setLocationText(`📍 ${err.code===1?TXT.denied:TXT.unavailable}`,""),
    {enableHighAccuracy:true,timeout:12000,maximumAge:600000}
  );
}

const loadingEl = document.getElementById("loadingText");
if(loadingEl) loadingEl.textContent = TXT.loading;

requestLocation();
setInterval(updateWeather,10*60*1000);
</script>



<script>
function fitPhonePreview() {
  const tv = document.querySelector('.tv');
  if (!tv) return;

  const portraitPhone = window.matchMedia('(orientation: portrait) and (max-width: 900px)').matches;

  if (portraitPhone) {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) * 1.02;
    tv.style.transform = `translate(-50%, -50%) scale(${scale})`;
  } else {
    tv.style.transform = '';
  }
}

window.addEventListener('resize', fitPhonePreview);
window.addEventListener('orientationchange', fitPhonePreview);
fitPhonePreview();
</script>

<script id="v37-weather-map-script">
(function(){
  const mini=document.getElementById('mapMini');
  const overlay=document.getElementById('mapOverlay');
  const close=document.getElementById('mapClose');
  const smallFrame=document.getElementById('mapMiniFrame');
  const largeFrame=document.getElementById('mapLargeFrame');
  // Windy's public embedded map. The larger view starts at the current location if available.
  function mapUrl(zoom){
    const lat=Number.isFinite(CURRENT_LAT)?CURRENT_LAT:26.335;
    const lon=Number.isFinite(CURRENT_LON)?CURRENT_LON:127.806;
    const p=new URLSearchParams({lat:String(lat),lon:String(lon),detailLat:String(lat),detailLon:String(lon),width:'900',height:'550',zoom:String(zoom),level:'surface',overlay:'temp',product:'ecmwf',menu:'',message:'',marker:'',calendar:'now',pressure:'',type:'map',location:'coordinates',detail:'',metricWind:'km/h',metricTemp:'°C'});
    return 'https://embed.windy.com/embed2.html?'+p.toString();
  }
  smallFrame.src=mapUrl(7);
  // Reload the preview once location is known; do not change the Open-Meteo refresh cycle.
  const mapLocationRefresh=setInterval(()=>{
    if(Number.isFinite(CURRENT_LAT)&&Number.isFinite(CURRENT_LON)){
      clearInterval(mapLocationRefresh);
      smallFrame.src=mapUrl(7);
    }
  },1000);
  function openMap(event){
    if(event){event.preventDefault();event.stopPropagation();}
    const url=mapUrl(7);
    document.getElementById('mapExternal').href=url;
    overlay.hidden=false;
    largeFrame.src=url;
    close.focus();
  }
  function closeMap(event){
    if(event){event.preventDefault();event.stopPropagation();}
    overlay.hidden=true;
    largeFrame.src='about:blank';
    mini.focus();
  }
  mini.addEventListener('click',openMap);
  close.addEventListener('click',closeMap);
  overlay.addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeMap(e);});
  // On a mouse, the small preview grows subtly on hover; click opens the interactive map.
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(console.warn)); }</script>
